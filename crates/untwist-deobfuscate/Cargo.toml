[package]
name = "untwist-deobfuscate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["javascript", "deobfuscator", "obfuscator", "string-array"]
categories = ["development-tools", "parser-implementations"]
description = "Passes that undo javascript-obfuscator string arrays, decoders, control-flow flattening and protections"

[dependencies]
untwist-core = { path = "../untwist-core", version = "0.1.0" }
untwist-eval = { path = "../untwist-eval", version = "0.1.0" }
untwist-unminify = { path = "../untwist-unminify", version = "0.1.0" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_str.workspace = true
oxc_syntax.workspace = true
oxc_traverse.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true

[features]
refusal-spans = []
test-hooks = ["refusal-spans"]

[dev-dependencies]
untwist-deobfuscate = { path = ".", features = ["test-hooks"] }
untwist = { path = "../untwist", features = ["test-hooks"] }
untwist-testing = { path = "../untwist-testing" }
oxc_codegen.workspace = true
oxc_parser.workspace = true
insta.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
