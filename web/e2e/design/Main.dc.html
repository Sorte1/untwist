<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Untwist playground</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<style>
.app{--bg:{{t.bg}};--panel:{{t.panel}};--head:{{t.head}};--code:{{t.code}};--border:{{t.border}};--hair:{{t.hair}};--text:{{t.text}};--muted:{{t.muted}};--faint:{{t.faint}};--btn:{{t.btn}};--btn-border:{{t.btnBorder}};--strand-a:{{t.strandA}};--strand-b:{{t.strandB}};--accent:{{t.accent}};--on-accent:{{t.onAccent}};--ok:{{t.ok}};--warn:{{t.warn}};--sans:'Spline Sans',system-ui,sans-serif;--mono:'Spline Sans Mono',ui-monospace,monospace}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app{height:100vh;display:grid;grid-template-rows:48px minmax(0,1fr) 30px;grid-template-columns:minmax(0,1fr);background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;letter-spacing:.005em;word-spacing:.08em;-webkit-font-smoothing:antialiased}
:where(.app) button{font:inherit;letter-spacing:inherit}
.grow{flex:1 1 auto}
.strand{stroke-width:2.4}.strand-a{stroke:var(--strand-a)}.strand-b{stroke:var(--strand-b)}.strand-gap{stroke:var(--bg);stroke-width:5.6}
.bar{display:flex;align-items:center;gap:8px;min-width:0;padding:0 12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;margin-right:10px}
.brand-name{font-size:17px;font-weight:600;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;border:1px solid var(--btn-border);background:var(--btn);color:var(--text);white-space:nowrap}
.btn-bar{height:32px;gap:7px;border-color:transparent;background:transparent}
.examples-btn{border-color:var(--border)}
.examples-text{display:inline-flex;gap:5px}
.muted{color:var(--muted)}.strong{font-weight:500}
.chevron{color:var(--muted)}
.btn-icon{justify-content:center;width:32px;padding:0}
.btn-small{height:28px}
.btn-square{justify-content:center;width:28px;height:28px;padding:0}
.mode-seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;border:1px solid var(--border);background:var(--code)}
.mode-btn{height:26px;padding:0 11px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500}
.mode-on{border-color:var(--btn-border);background:var(--btn);color:var(--text)}
.btn-run{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 13px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;white-space:nowrap}
.kbd{white-space:nowrap;font-family:var(--mono);font-size:11px;font-weight:500;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--on-accent) 14%,transparent);word-spacing:normal;letter-spacing:normal}
.workspace{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panes{flex:1 1 auto;min-height:0;display:flex}
.pane{position:relative;flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;border-top:2px solid var(--strand-a);background:var(--code);overflow:hidden}
.pane-output{border-top-color:var(--strand-b);border-left:1px solid var(--border)}
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 14px;border-bottom:1px solid var(--hair);background:var(--head)}
.pane-head .btn{border-color:transparent;background:transparent}
.pane-title{display:inline-flex;align-items:center;gap:7px;margin:0 4px 0 0;font-size:13px;font-weight:600}
.glyph{flex:0 0 auto}.glyph .strand{stroke-width:1.7}.glyph .strand-gap{stroke:var(--head);stroke-width:4.2}
.mono-name{font-family:var(--mono);font-size:12px;color:var(--muted);word-spacing:normal;letter-spacing:normal}
.pane-body{flex:1 1 auto;min-height:0;display:flex}
.pane-foot{flex:0 0 auto;display:flex;gap:14px;min-height:26px;align-items:center;padding:2px 8px 2px 14px;border-top:1px solid var(--hair);background:var(--head);font-size:11.5px;color:var(--muted)}
.meta{font-family:var(--mono);font-size:11px;word-spacing:normal;letter-spacing:normal}
.strip{display:flex;align-items:center;gap:12px;min-width:0;padding:0 6px 0 14px;border-top:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.elapsed{font-family:var(--mono);font-size:12px;color:var(--text);word-spacing:normal;letter-spacing:normal}
.privacy{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
.strip-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:0;border-radius:5px;background:transparent;color:var(--text);font-size:12px;font-weight:500}
</style>
<div class="app">

<header class="bar">
<div class="brand"><svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke-linecap="round"><path class="strand strand-b" d="M3 16C7.5 16 8 8 12.5 8H21"></path><path class="strand-gap" d="M3 8C7.5 8 8 16 12.5 16H21"></path><path class="strand strand-a" d="M3 8C7.5 8 8 16 12.5 16H21"></path></g></svg><span class="brand-name">untwist</span></div>
<div><button type="button" class="btn btn-bar examples-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h4M6.5 2v4L3 12.5A1 1 0 0 0 3.9 14h8.2a1 1 0 0 0 .9-1.5L9.5 6V2"></path><path d="M4.6 10h6.8"></path></svg><span class="examples-text"><span class="muted">Example</span> <span class="strong">none</span></span><svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button></div>
<div class="grow"></div>
<div class="mode-seg"><button type="button" class="mode-btn mode-on">Safe</button><button type="button" class="mode-btn">Unsafe</button></div>
<button type="button" class="btn btn-bar"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"></path><circle cx="10" cy="4.5" r="1.5"></circle><circle cx="6" cy="11.5" r="1.5"></circle></svg><span>Settings</span></button>
<button type="button" class="btn btn-bar btn-icon"><sc-if value="{{dark}}"><svg class="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"></path></svg></sc-if><sc-if value="{{light}}"><svg class="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"></path></svg></sc-if></button>
<button type="button" class="btn-run"><svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z"></path></svg><span>Run</span><span class="kbd">Ctrl ↵</span></button>
</header>

<main class="workspace">
<div class="panes">
<section class="pane">
<div class="pane-head">
<h2 class="pane-title"><svg class="glyph" width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="none" stroke-linecap="round"><path class="strand strand-a" d="M1.5 9.5C7 9.5 11 2.5 16.5 2.5"></path><path class="strand-gap" d="M1.5 2.5C7 2.5 11 9.5 16.5 9.5"></path><path class="strand strand-a" d="M1.5 2.5C7 2.5 11 9.5 16.5 9.5"></path></g></svg>Input</h2>
<span class="mono-name">untitled.js</span>
<div class="grow"></div>
<button type="button" class="btn btn-small"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6z"></path><path d="M9 2v4h4"></path><path d="M8 12V8.5M6.5 10 8 8.5 9.5 10"></path></svg><span>Open file</span></button>
<button type="button" class="btn btn-square"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
<button type="button" class="btn btn-square"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"></rect><path d="M6 2.5v11M10.5 6.5 9 8l1.5 1.5"></path></svg></button>
</div>
<div class="pane-body"></div>
<div class="pane-foot"><span class="meta">11 B · 1 line</span><div class="grow"></div><span>Paste, type or drop a file anywhere</span></div>
</section>
<section class="pane pane-output">
<div class="pane-head">
<h2 class="pane-title"><svg class="glyph" width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="none" stroke-linecap="round"><path class="strand strand-b" d="M1.5 3.5H16.5M1.5 8.5H16.5"></path></g></svg>Output</h2>
</div>
<div class="pane-body"></div>
<div class="pane-foot"><span class="meta">output.js · 2 lines</span></div>
</section>
</div>
</main>

<footer class="strip">
<span class="status"><span class="dot"></span><span>Done</span></span>
<span class="elapsed">0.02 s</span>
<div class="grow"></div>
<span class="privacy"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg><span>Runs in your browser — nothing is uploaded</span></span>
<button type="button" class="strip-toggle"><span>1 note</span><svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"></path></svg></button>
</footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  pal(theme) {
    if (theme === 'light') return {
      bg: '#ECEAF2', panel: '#FFFFFF', head: '#F4F3F8', code: '#FCFBFE', border: '#D6D2E1', hair: '#E8E5EF',
      text: '#1C1A25', muted: '#575270', faint: '#686381', btn: '#FFFFFF', btnBorder: '#CFCBDB',
      strandA: '#B0236A', strandB: '#06705F', accent: '#06705F', onAccent: '#FFFFFF', ok: '#1E6B39', warn: '#875700'
    };
    return {
      bg: '#1C1A25', panel: '#24212F', head: '#1F1C29', code: '#16141E', border: '#353145', hair: '#2A2737',
      text: '#EDEBF5', muted: '#A9A4C0', faint: '#9893B2', btn: '#272434', btnBorder: '#3A3650',
      strandA: '#FF7EB6', strandB: '#52DCC8', accent: '#52DCC8', onAccent: '#0E2723', ok: '#7FE0A8', warn: '#FFCB6B'
    };
  }

  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    return { t: this.pal(theme), dark: theme === 'dark', light: theme === 'light' };
  }
}
</script>
</body>
</html>
