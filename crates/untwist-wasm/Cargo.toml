[package]
name = "untwist-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The single-threaded WebAssembly build of untwist, published to npm as untwist"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
untwist = { path = "../untwist", default-features = false, features = ["refusal-spans"] }
untwist-core = { path = "../untwist-core" }
untwist-eval = { path = "../untwist-eval" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.1.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1", "-g"]
