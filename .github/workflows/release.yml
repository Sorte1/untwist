name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify 'HEAD^{commit}')
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $sha, which is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: The tag matches the version everywhere
        run: cargo xtask check-version "$GITHUB_REF_NAME"

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_SECONDS: "5400"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify 'HEAD^{commit}')
          query="repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=test&filter=latest&per_page=100"
          rows='.check_runs[] | select(.app.slug == "github-actions") | [.status, (.conclusion // "none"), .html_url] | @tsv'
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            if runs=$(gh api --paginate "$query" --jq "$rows"); then
              failed=$(awk -F'\t' '$1 == "completed" && $2 != "success"' <<< "$runs")
              pending=$(awk -F'\t' 'NF && $1 != "completed"' <<< "$runs")
              if [ -n "$failed" ]; then
                echo "::error::the CI test job did not pass on $sha"
                echo "$failed"
                exit 1
              fi
              if [ -n "$runs" ] && [ -z "$pending" ]; then
                echo "the CI test job passed on $sha"
                exit 0
              fi
              if [ -z "$runs" ]; then
                echo "no CI test job on $sha yet"
              else
                echo "the CI test job on $sha is still running"
              fi
            else
              echo "the check-runs query failed; trying again"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no passing CI test job on $sha after $WAIT_SECONDS seconds"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  crates:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Skip the crates whose version is already on crates.io
        id: pending
        run: |
          set -euo pipefail
          exclude=""
          count=0
          while IFS=$'\t' read -r name version; do
            lower=${name,,}
            case ${#lower} in
              1) path="1/$lower" ;;
              2) path="2/$lower" ;;
              3) path="3/${lower:0:1}/$lower" ;;
              *) path="${lower:0:2}/${lower:2:2}/$lower" ;;
            esac
            status=$(curl -sS -o "$RUNNER_TEMP/index" -w '%{http_code}' "https://index.crates.io/$path")
            if [ "$status" = 200 ] && jq -e --arg v "$version" 'select(.vers == $v)' "$RUNNER_TEMP/index" >/dev/null; then
              echo "$name $version is already on crates.io"
              exclude="$exclude --exclude $name"
            elif [ "$status" = 200 ] || [ "$status" = 404 ]; then
              echo "$name $version will be published"
              count=$((count + 1))
            else
              echo "::error::the crates.io index answered $status for $name"
              exit 1
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"

      - name: Get a crates.io token through trusted publishing
        id: auth
        if: steps.pending.outputs.count != '0'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the crates in dependency order
        if: steps.pending.outputs.count != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDE: ${{ steps.pending.outputs.exclude }}
        run: |
          read -ra exclude <<< "$EXCLUDE"
          cargo publish --workspace "${exclude[@]}"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install -g npm@11.21.1

      - name: Skip the package if its version is already on npm
        id: pending
        working-directory: crates/untwist-wasm/npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$name $version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/wasm-toolchain
        if: steps.pending.outputs.publish == 'true'

      - name: Build and publish the package
        if: steps.pending.outputs.publish == 'true'
        working-directory: crates/untwist-wasm/npm
        run: |
          npm run build
          npm publish --provenance --access public

  web:
    needs: [verify, crates, npm]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      production: true
    secrets: inherit

  github-release:
    needs: [verify, crates, npm, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          heading="## [${TAG#v}]"
          awk -v heading="$heading" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes under $heading"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
