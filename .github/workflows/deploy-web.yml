name: Deploy web

on:
  push:
    paths:
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/wasm-toolchain/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      production:
        description: Deploy this ref to production (run it on a release tag)
        type: boolean
        default: false
  workflow_call:
    inputs:
      production:
        description: Deploy to production instead of a branch preview
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-web-${{ inputs.production && 'production' || github.ref }}
  cancel-in-progress: ${{ !inputs.production }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/wasm-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Check the branch name and that the deploy secrets exist
        id: gate
        env:
          BRANCH: ${{ inputs.production && 'main' || (github.ref_name == 'main' && 'main-latest' || github.ref_name) }}
          PRODUCTION: ${{ inputs.production && 'true' || 'false' }}
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::branch name $BRANCH has characters wrangler should not see"
            exit 1
          fi
          if [ "$PRODUCTION" != "true" ] && [ "$BRANCH" = "main" ]; then
            echo "::error::main deploys to production only through a release; run this with production set"
            exit 1
          fi
          if [ "$PRODUCTION" != "true" ] && [ "$BRANCH" = "main-latest" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::main-latest is reserved for the build of the main branch"
            exit 1
          fi
          if [ "$HAS_SECRETS" != "true" ] && [ "$PRODUCTION" = "true" ]; then
            echo "::error::a production deploy needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy"
          fi
          echo "deploy=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: pages
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=untwist --branch=${{ steps.gate.outputs.branch }}

      - name: Post the preview link on the branch's open pull request
        if: steps.gate.outputs.deploy == 'true' && !inputs.production && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "no open pull request for $BRANCH"
            exit 0
          fi
          marker='<!-- untwist-preview -->'
          body=$(printf '%s\n**Preview:** %s\n\nBranch link: %s\nCommit: %s' "$marker" "$URL" "${ALIAS:-$URL}" "$SHA")
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
