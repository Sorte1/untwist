[package]
name = "untwist-rename"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["javascript", "rename", "identifiers", "deobfuscator"]
categories = ["development-tools", "parser-implementations"]
description = "Scope-safe identifier renaming for untwist: mangle, simple and unique modes"

[features]
default = ["libraries-core"]
test-hooks = ["untwist-core/test-hooks"]
libraries-core = ["dep:untwist-libraries-core"]
libraries-corejs = ["dep:untwist-libraries-corejs"]
libraries-polyfills = ["dep:untwist-libraries-polyfills"]
libraries-react = ["dep:untwist-libraries-react"]
libraries-frameworks = ["dep:untwist-libraries-frameworks"]
libraries-lodash = ["dep:untwist-libraries-lodash"]
libraries-dates = ["dep:untwist-libraries-dates"]
libraries-state = ["dep:untwist-libraries-state"]
libraries-data = ["dep:untwist-libraries-data"]
libraries-game = ["dep:untwist-libraries-game"]
libraries-pixi = ["dep:untwist-libraries-pixi"]
libraries-three = ["dep:untwist-libraries-three"]
libraries-all = ["libraries-core", "libraries-corejs", "libraries-polyfills", "libraries-react", "libraries-frameworks", "libraries-lodash", "libraries-dates", "libraries-state", "libraries-data", "libraries-game", "libraries-pixi", "libraries-three"]
modern = []

[dependencies]
untwist-core = { path = "../untwist-core", version = "0.5.0" }
untwist-eval = { path = "../untwist-eval", version = "0.5.0" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_str.workspace = true
oxc_syntax.workspace = true
rustc-hash.workspace = true
miniz_oxide = "0.9.1"
untwist-libraries-core = { path = "../untwist-libraries-core", version = "0.5.0", optional = true }
untwist-libraries-corejs = { path = "../untwist-libraries-corejs", version = "0.5.0", optional = true }
untwist-libraries-polyfills = { path = "../untwist-libraries-polyfills", version = "0.5.0", optional = true }
untwist-libraries-react = { path = "../untwist-libraries-react", version = "0.5.0", optional = true }
untwist-libraries-frameworks = { path = "../untwist-libraries-frameworks", version = "0.5.0", optional = true }
untwist-libraries-lodash = { path = "../untwist-libraries-lodash", version = "0.5.0", optional = true }
untwist-libraries-dates = { path = "../untwist-libraries-dates", version = "0.5.0", optional = true }
untwist-libraries-state = { path = "../untwist-libraries-state", version = "0.5.0", optional = true }
untwist-libraries-data = { path = "../untwist-libraries-data", version = "0.5.0", optional = true }
untwist-libraries-game = { path = "../untwist-libraries-game", version = "0.5.0", optional = true }
untwist-libraries-pixi = { path = "../untwist-libraries-pixi", version = "0.5.0", optional = true }
untwist-libraries-three = { path = "../untwist-libraries-three", version = "0.5.0", optional = true }

[dev-dependencies]
untwist-rename = { path = ".", features = ["test-hooks", "modern"] }
untwist-testing = { path = "../untwist-testing" }
