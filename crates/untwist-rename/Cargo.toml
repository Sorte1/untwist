[package]
name = "untwist-rename"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["javascript", "rename", "identifiers", "deobfuscator"]
categories = ["development-tools", "parser-implementations"]
description = "Scope-safe identifier renaming for untwist: mangle, simple and unique modes"

[features]
test-hooks = ["untwist-core/test-hooks"]

[dependencies]
untwist-core = { path = "../untwist-core", version = "0.3.1" }
untwist-eval = { path = "../untwist-eval", version = "0.3.1" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_str.workspace = true
oxc_syntax.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
untwist-rename = { path = ".", features = ["test-hooks"] }
untwist-testing = { path = "../untwist-testing" }
