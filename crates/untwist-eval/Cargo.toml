[package]
name = "untwist-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["javascript", "interpreter", "constant-folding", "deobfuscator"]
categories = ["development-tools", "parser-implementations"]
description = "Constant folding and a sandboxed, step-budgeted JavaScript interpreter for untwist"

[features]
value-api = []
test-hooks = ["value-api"]

[dependencies]
untwist-core = { path = "../untwist-core", version = "0.3.1" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_codegen.workspace = true
oxc_span.workspace = true
oxc_str.workspace = true
oxc_syntax.workspace = true
ryu-js.workspace = true
sha2.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
regress.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker.workspace = true
psm.workspace = true

[dev-dependencies]
untwist-eval = { path = ".", features = ["test-hooks"] }
untwist-testing = { path = "../untwist-testing" }
oxc_parser.workspace = true
oxc_ecmascript.workspace = true
serde.workspace = true
serde_json.workspace = true
criterion.workspace = true
rayon.workspace = true

[[bench]]
name = "decode"
harness = false

[[test]]
name = "stack_main_thread"
harness = false
